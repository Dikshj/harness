name: autonomous-harness-ci

on:
  push:
    paths:
      - "autonomous-harness/**"
  pull_request:
    paths:
      - "autonomous-harness/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: autonomous-harness
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: autonomous-harness/frontend/package-lock.json
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest tests/unit -q
      - run: npm ci
        working-directory: autonomous-harness/frontend
      - run: npm audit
        working-directory: autonomous-harness/frontend
      - run: npm run build
        working-directory: autonomous-harness/frontend
